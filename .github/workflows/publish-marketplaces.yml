# The only workflow here that pushes. On every push to master it rebuilds all
# three host marketplaces from the neutral kernels and commits the result.
#
# It publishes all three or none. A marketplace where one host is a commit ahead
# of the others is exactly the drift the compiler exists to prevent, so the
# staged set below is fixed and the final --check runs before the commit rather
# than after it.
#
# The bot-identity guard is what stops the job answering its own commit. It is
# identity-based on purpose: the predecessor matched a marker string in the head
# commit message, which reads the body as well as the subject, so a commit that
# merely mentioned the marker in its prose silenced the job. Never gate a
# workflow on prose the author is free to write.
#
# The last step tags the published tree as a GitHub Release, one per marketplace
# version. It is keyed on metadata.version rather than on the push, so a push
# that changes no version finds the release already there and does nothing. The
# release carries no asset: the install path is the marketplace, and the tag
# exists so a revision can be pinned and a version can be traced to a commit.
name: publish-marketplaces

on:
  push:
    branches: [master]

concurrency:
  group: publish-marketplaces
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate before building
        run: python -m unittest discover -s tests

      - name: Build all three native marketplaces
        run: python scripts/daodan_build.py

      - name: Verify the built tree reproduces
        run: python scripts/daodan_build.py --check --support

      - name: Commit the publication, or exit clean when nothing moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            exports/claude \
            exports/copilot \
            exports/codex \
            .claude-plugin/marketplace.json \
            .github/plugin/marketplace.json \
            .agents/plugins/marketplace.json
          if git diff --cached --quiet; then
            echo "no drift: the committed marketplaces already match the kernels"
            exit 0
          fi
          git commit -m "Publish native Daodan marketplaces"
          git push

      - name: Release the published marketplace version, or skip when it is already tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['metadata']['version'])")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} is already published: nothing to do"
            exit 0
          fi
          cat > "${RUNNER_TEMP}/release-notes.md" <<'NOTES'
          Marketplace version `__DAODAN_VERSION__`, identical across all three hosts.

          ```bash
          claude plugin marketplace add acaprino/daodan
          copilot plugin marketplace add acaprino/daodan
          codex plugin marketplace add acaprino/daodan
          ```

          Then install what you need, for example `claude plugin install senior-review@daodan`.

          This tag records the commit a version was published from, for anyone pinning a
          revision or submitting to a curated directory. It carries no asset. Registering the
          repository root as a marketplace installs from `master`, which is the supported path.
          NOTES
          sed -i "s/__DAODAN_VERSION__/${version}/g" "${RUNNER_TEMP}/release-notes.md"
          gh release create "$tag" \
            --target "$(git rev-parse HEAD)" \
            --title "Daodan ${version}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --generate-notes \
            --latest

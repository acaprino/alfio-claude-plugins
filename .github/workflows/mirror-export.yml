# Mirrors plugins/ into exports/vscode/ and pushes the result.
#
# Step 3 of the marketplace update workflow used to be a manual obligation on
# every plugin change: mirror the bundle, regenerate the manifest, bump the
# extension version. Since the 2026-07-30 catalog build every plugin feeds a
# bundle, so the obligation fires on nearly every commit, and an obligation that
# fires that often is one that gets skipped. It was:
# `skills-creator/references/conventions.md` sat at a superseded version of its
# source in a bundle nothing adapts, and the extension version drifted two
# majors behind the marketplace.
#
# Only the mechanical half runs here, and the split is deliberate. Byte-copies,
# the manifest and the version number are derivations, so a machine owns them.
# Agents, prompts, every SKILL.md and six adapted reference files are ports:
# they need frontmatter rewritten, tools renamed, namespaces stripped and
# dispatch rerouted. When one of their sources moves without them, this workflow
# fails and says so rather than guessing at an adaptation.
name: mirror-export

on:
  push:
    branches: [master]

# Needed to push the mirror commit. Repository-level default workflow
# permissions must be `write` for this to be grantable at all; a workflow's own
# permissions block cannot exceed that ceiling.
permissions:
  contents: write

# One mirror at a time. Two concurrent pushes would each compute a mirror
# against a different base and the loser would push a commit reverting the
# winner. Not cancel-in-progress: a cancelled run leaves master unmirrored.
concurrency:
  group: mirror-export
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # A push whose only content is the previous run's mirror commit has nothing
    # left to mirror. Skipping it is what keeps the workflow from answering its
    # own push forever.
    if: "!contains(github.event.head_commit.message, '[mirror]')"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Mirror the mechanical half
        run: python scripts/mirror_export.py

      - name: Regenerate the extension manifest
        run: python .claude/skills/downstream-exports/scripts/gen_extension_manifest.py

      # Runs against the mirrored tree, not the pushed one: mirroring is what
      # makes the byte-copies current, so checking before it would report
      # findings the next step was about to fix.
      - name: VS Code export structural check
        run: python .claude/skills/downstream-exports/scripts/check_export.py

      - name: Commit the mirror
        run: |
          if git diff --quiet; then
            echo "mirror already current; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          git commit -m "Mirror plugins into the VS Code export [mirror]" \
                     -m "Automated by .github/workflows/mirror-export.yml."
          git push

      # Last, so that a source moving without its adapted twin still gets the
      # byte-copies and the manifest mirrored before the run goes red. The
      # range is the pushed commits; on a branch creation there is no base and
      # the check has nothing to say.
      - name: Adapted files left behind by their source
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base revision unknown (branch creation or pruned history); skipping"
            exit 0
          fi
          python scripts/mirror_export.py --check --since "$BASE"

# Marketplace consistency checks. All content in this repo is static markdown,
# so there is no build or test job: these are the mechanical versions of the
# contracts documented in CLAUDE.md. Every script is stdlib-only Python and
# runs from the repository root, so failures reproduce locally with the same
# commands.
name: consistency

on:
  push:
    branches: [master]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Dependency graph lint
        run: python scripts/lint_dependency_graph.py

      - name: VS Code export structural check
        run: python .claude/skills/downstream-exports/scripts/check_export.py

      - name: VS Code extension manifest freshness
        run: python .claude/skills/downstream-exports/scripts/gen_extension_manifest.py --check

  # Enforces steps 1 and 2 of the marketplace update workflow: a change under
  # plugins/<name>/ must bump that plugin's version and metadata.version in
  # marketplace.json within the same push or PR.
  version-bumps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Version bumps over the pushed or PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base revision unknown (branch creation or pruned history); skipping"
            exit 0
          fi
          python scripts/check_version_bumps.py "$BASE" HEAD

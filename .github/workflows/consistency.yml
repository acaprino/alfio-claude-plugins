# Marketplace consistency checks. Content in this repo is static markdown with
# a small number of stdlib-only helper scripts, so there is no build job: these
# are the mechanical versions of the contracts documented in CLAUDE.md, plus
# unit tests for the helper scripts that have branching logic. Every script is
# stdlib-only Python and runs from the repository root, so failures reproduce
# locally with the same commands.
name: consistency

on:
  push:
    branches: [master]
  pull_request:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Dependency graph lint
        run: python scripts/lint_dependency_graph.py

      - name: Bundled path lint
        run: python scripts/lint_bundled_paths.py

      - name: Concept index script tests
        run: python -m unittest discover -s tests -v

      - name: Plugin registration lint
        run: python scripts/lint_plugin_registration.py

      - name: Fact anchor lint
        run: python scripts/lint_fact_anchors.py

      - name: Broker plugin contract lint
        run: python scripts/lint_broker_plugins.py

      - name: VS Code export structural check
        run: python .claude/skills/downstream-exports/scripts/check_export.py

      - name: VS Code extension manifest freshness
        run: python .claude/skills/downstream-exports/scripts/gen_extension_manifest.py --check

  # Proves the extension still packages. The structural checks above read the
  # manifest, they never run vsce over it, so a contribution path that points
  # at a file no longer on disk passes them and fails at release time instead.
  # Catching it here keeps a tag from being the first thing that discovers it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Package the VS Code extension
        run: |
          cd exports/vscode
          npx --yes @vscode/vsce package --no-dependencies \
            --out "$RUNNER_TEMP/daodan.vsix"

  # Enforces steps 1 and 2 of the marketplace update workflow: a change under
  # plugins/<name>/ must bump that plugin's version and metadata.version in
  # marketplace.json within the same push or PR.
  version-bumps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Version bumps over the pushed or PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base revision unknown (branch creation or pruned history); skipping"
            exit 0
          fi
          python scripts/check_version_bumps.py "$BASE" HEAD

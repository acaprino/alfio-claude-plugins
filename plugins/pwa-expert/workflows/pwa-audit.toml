name = "pwa-audit"
entrypoint = "pwa-audit.md"

[[phases]]
id = "scope"
isolation = "shared"
produces = ["artifact:scope"]

[[phases]]
id = "review"
needs = ["scope"]
role = "pwa-architect"
isolation = "required"
consumes = ["artifact:scope"]
produces = ["artifact:pwa-audit-report"]

[contract]
inputs = ["repository"]
outcomes = ["pwa-audit-completed"]
artifacts = ["pwa-audit-report"]
schemas = []

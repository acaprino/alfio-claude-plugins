name = "libgdx-audit"
entrypoint = "libgdx-audit.md"

[[phases]]
id = "scope"
isolation = "shared"
produces = ["artifact:scope"]

[[phases]]
id = "review"
needs = ["scope"]
role = "libgdx-architect"
isolation = "required"
consumes = ["artifact:scope"]
produces = ["artifact:libgdx-audit-report"]

[contract]
inputs = ["repository"]
outcomes = ["libgdx-audit-completed"]
artifacts = ["libgdx-audit-report"]
schemas = []

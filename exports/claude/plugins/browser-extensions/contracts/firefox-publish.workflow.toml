name = "firefox-publish"
entrypoint = "firefox-publish.md"

[[phases]]
id = "scope"
isolation = "shared"
produces = ["artifact:scope"]

[[phases]]
id = "review"
needs = ["scope"]
role = "firefox-extension-dev"
isolation = "required"
consumes = ["artifact:scope"]
produces = ["artifact:firefox-publish-report"]

[contract]
inputs = ["repository"]
outcomes = ["firefox-publish-completed"]
artifacts = ["firefox-publish-report"]
schemas = []

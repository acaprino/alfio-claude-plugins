name = "review"
entrypoint = "review.md"

[[phases]]
id = "inspect"
fanout = ["role:../outside"]
isolation = "required"
join = "all-delivered"
concurrency = "preferred"
produces = ["artifact:report"]

[contract]
inputs = ["repository"]
outcomes = ["reviewers-use-isolated-contexts"]
artifacts = ["report"]
schemas = ["contracts/reviewer-result.toml"]
